name: Build Release APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android platform files
        run: flutter create --platforms android .

      - name: Bump compileSdkVersion and targetSdkVersion to 34
        run: |
          sed -i 's/compileSdkVersion = 33/compileSdkVersion = 34/g' android/app/build.gradle
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion = 33/targetSdkVersion = 34/g' android/app/build.gradle
          sed -i 's/targetSdkVersion 33/targetSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdk = 33/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = 33/targetSdk = 34/g' android/app/build.gradle
          grep -nE 'compileSdk|targetSdk' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blocno0te-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
